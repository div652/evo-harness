# Campaign 22 (C9): test of campaign 21's winner (2026-10-23).
# Campaign 21 re-validated campaign 12's checkpoints C0, C5-C10 on its 20
# validation tasks via CAO; C9 had the highest all-pass (ties broken by
# task pass). It is evaluated here 3 times on the 70 test tasks of campaign 15
# (none of which are among the 20 validation tasks), to compare with C5's
# 3-trial results there (c15/15b on Copilot, c18/c19 on TRAPI).
# Setup = campaign 21 (CAO gateway, Responses API, gpt-5.6-sol high, 32768
# output tokens, one gpt-6.1-sol high judge, no helper), with campaign 20's
# concurrency (one campaign alone); harness ./harness_c12_C9.
# Generated from ahe-cao-c22-test70-TEMPLATE.yaml by scripts/run_c22.sh.
# CAO_API_KEY must hold the gateway key (/home/agarwaldi/cao/profile/.gateway-key).
# Run only with scripts/run_c0_train_only.py (rounds: 0), in this worktree.
schema_version: 1

campaign:
  name: harvey-lab-campaign-22-cao-test70-C9
  artifacts_dir: ./campaign-artifacts/harvey-lab-campaign-22-cao-test70-C9
  rounds: 0
  root_seed: 42

project:
  harness_dir: ./harness_c12_C9
  harness_manifest: ./harness_manifest_lab.yaml
  adapter: benchmark_adapter:HarveyAdapter
  adapter_settings:
    lab_root: ../../harvey-labs
    # Campaign 15's 70 test tasks (as its train split).
    split_file: ./splits-firm-knowledge-c15-eval70.json
    apply_task_filter: false
    # LAB's OpenAI judge path (Responses API, strict JSON schema on all but
    # the last try) with one judge.
    judge_api: openai_responses
    judges:
      - model: gpt-6.1-sol
        max_tokens: 8192
        reasoning_effort: high
        temperature: null
    # No helper model: deliverables LAB cannot match by name stay unmatched.
    helper: null
    judge_max_prompt_chars: 240000
    sandbox_image: lab-sandbox:latest
    shell_timeout: 60
    scratch_root: null
    # As campaign 9b; verdicts do not depend on grading parallelism.
    grading_parallel: 10
    # As campaign 20.
    judge_max_concurrent_calls: 9
    grading_attempts: 2
    attribution_min_task_delta: 0.0
    trial_processes: true
    # As the colleague's run: an API rejection mid-run reruns the trial
    # instead of grading the partial work (the default, grade, was used by
    # every earlier campaign; 9b had no such errors).
    api_rejection_policy: rerun
  adapter_dependency_paths:
    - ./benchmark_adapter.py
    - ./harvey_ahe
    - ./splits-firm-knowledge-c15-eval70.json
    - ./pyproject.toml
    - ./requirements.txt
  meta_agent_source_roots:
    - ./benchmark_public

models:
  evaluated:
    model: gpt-5.6-sol
    # The output cap of the colleague's gateway run.
    max_tokens: 32768
    reasoning_effort: high
    # Not sent: reasoning models on the Responses API take no temperature.
    temperature: null
  # Not used by a C0-only run.
  meta:
    model: gpt-5.6-sol
    max_tokens: 32000
    reasoning_effort: high
    temperature: null

transport:
  provider: gh_copilot_server
  base_url: http://127.0.0.1:4141/v1
  api_key_env: CAO_API_KEY
  api_mode: responses
  stream: false
  request_timeout_seconds: 600
  observable_model_policy: exact
  # CAO lists its models and rejects an unknown one, so both checks run.
  model_catalog: required
  negative_control: required
  # As campaign 20. Agents use at most max_concurrency of these slots.
  max_concurrent_requests: 12
  hung_call_retries: 2
  # As campaign 13b.
  transient_retries: 6
  transient_max_wait_seconds: 120

evaluation:
  # As campaigns 15/15b and 18+19.
  train_trials: 3
  validation_trials: 1
  test_trials: 1
  # As campaign 20.
  max_concurrency: 10

debugger:
  max_concurrency: 4
  max_iterations: 25

recovery:
  # 3 in campaign 13. Each attempt runs only the units still pending.
  maximum_stage_attempts: 10
  archive_incomplete_attempts: true

meta:
  backend: nexau
  explore:
    source_enabled: true
    web_enabled: true
    web_search_backend: ddgs
    research_seed_urls:
      - https://github.com/nex-agi/NexAU
  role_supplements:
    source: ./meta_supplements/source.md
    web: ./meta_supplements/web.md
    debugger: ./meta_supplements/debugger.md
    evolve: ./meta_supplements/evolve.md
  max_concurrent_model_calls: 4
  max_context_tokens: 200000
  max_running_subagents: 5
  evolve_max_iterations: 500
  explore_max_iterations: 200
  shell:
    backend: docker
    image: ahe-meta-shell:py313-v2
