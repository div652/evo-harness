# RRSI pilot (2026-10-27): campaign 23's models and route (gpt-5.6-luna agent,
# one gpt-5.6-sol judge, gpt-5.6-sol meta agents, all through CAO) with the
# RRSI algorithm, the criterion objective, and the 10-task pilot split.
# Two rounds of two variants. A pipeline check, not a result.
schema_version: 1
campaign:
  name: rrsi-pilot-cao-luna-pilot10
  artifacts_dir: ./campaign-artifacts/rrsi-pilot-cao-luna-pilot10
  rounds: 2
  root_seed: 42
project:
  harness_dir: ./harness_lab
  harness_manifest: ./harness_manifest_lab.yaml
  adapter: benchmark_adapter:HarveyAdapter
  adapter_settings:
    lab_root: ../../harvey-labs
    split_file: ./splits-firm-knowledge-pilot10.json
    apply_task_filter: false
    objective: criterion_pass
    judge_api: openai_responses
    judges:
    - model: gpt-5.6-sol
      max_tokens: 64000
      reasoning_effort: high
      temperature: null
    helper:
      model: claude-sonnet-5
      max_tokens: 1024
      temperature: 0.0
    helper_api: chat
    judge_max_prompt_chars: 240000
    sandbox_image: lab-sandbox:latest
    shell_timeout: 60
    scratch_root: null
    grading_parallel: 10
    judge_max_concurrent_calls: 18
    grading_attempts: 2
    attribution_min_task_delta: 0.0
    trial_processes: true
    api_rejection_policy: rerun
  adapter_dependency_paths:
  - ./benchmark_adapter.py
  - ./harvey_ahe
  - ./splits-firm-knowledge-pilot10.json
  - ./pyproject.toml
  - ./requirements.txt
  meta_agent_source_roots:
  - ./benchmark_public
models:
  evaluated:
    model: gpt-5.6-luna
    max_tokens: 128000
    reasoning_effort: provider-default
    temperature: null
    pricing:
      currency: copilot-catalog-units
      input_per_million: 20
      cached_input_per_million: 2
      cache_write_per_million: 25
      output_per_million: 120
      long_context:
        above_prompt_tokens: 200000
        input_per_million: 40
        cached_input_per_million: 4
        cache_write_per_million: 50
        output_per_million: 180
  meta:
    model: gpt-5.6-sol
    max_tokens: 32000
    reasoning_effort: high
    temperature: null
transport:
  base_url: http://127.0.0.1:4141/v1
  api_key_env: CAO_API_KEY
  api_mode: responses
  stream: false
  request_timeout_seconds: 600
  observable_model_policy: exact
  model_catalog: required
  negative_control: required
  max_concurrent_requests: 8
  hung_call_retries: 2
  transient_retries: 6
  transient_max_wait_seconds: 120
  model_rejection_phrases:
  - the requested model is not supported
  - This model does not support the responses endpoint
evaluation:
  train_trials: 2
  validation_trials: 1
  test_trials: 2
  max_concurrency: 8
debugger:
  max_concurrency: 4
  max_iterations: 25
recovery:
  maximum_stage_attempts: 10
  archive_incomplete_attempts: true
meta:
  backend: nexau
  explore:
    source_enabled: true
    web_enabled: true
    web_search_backend: ddgs
    research_seed_urls:
    - https://github.com/nex-agi/NexAU
    - https://python-docx.readthedocs.io/en/latest/
    - https://openpyxl.readthedocs.io/en/stable/
    - https://python-pptx.readthedocs.io/en/latest/
  role_supplements:
    source: ./meta_supplements/source.md
    web: ./meta_supplements/web.md
    debugger: ./meta_supplements/debugger.md
    evolve: ./meta_supplements/evolve.md
  max_concurrent_model_calls: 4
  max_context_tokens: 200000
  max_running_subagents: 5
  evolve_max_iterations: 500
  explore_max_iterations: 200
  roles:
    debugger:
      max_tokens: 20000
  shell:
    backend: docker
    image: ahe-meta-shell:py313-v2
algorithm:
  name: rrsi
  settings:
    variants_per_round: 2
    repair_rounds: 2
    objective:
      check_metric: pooled_criterion_pass_rate
    roles:
      analyst_max_iterations: 60
      digester_max_iterations: 30
      proposer_max_iterations: 200
      critic_max_iterations: 8
      digests_per_call: 6
  role_supplements:
    analyst: ./rrsi_supplements/analyst.md
    digester: ./rrsi_supplements/digester.md
    proposer: ./rrsi_supplements/proposer.md
    critic: ./rrsi_supplements/critic.md
