type: agent
name: candidate-reviewer
description: >-
  Read-only independent recall and candidate-closure reviewer for corpus-wide
  legal research. Call once after a provisional candidate ledger is reconciled
  and before drafting; do not call for work confined to explicitly named files.
max_iterations: 35
max_context_tokens: 300000
system_prompt: ./systemprompt.md
system_prompt_type: file
tool_call_mode: openai

llm_config:
  model: UNCONFIGURED
  base_url: http://127.0.0.1:1/v1
  api_key: local-placeholder
  max_tokens: 32000
  stream: false
  api_type: openai_chat_completion

tools:
  - name: read
    yaml_path: ../../tool_descriptions/read.tool.yaml
  - name: glob
    yaml_path: ../../tool_descriptions/glob.tool.yaml
  - name: grep
    yaml_path: ../../tool_descriptions/grep.tool.yaml
skills: []
sub_agents: []
middlewares: []
