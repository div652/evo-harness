type: tool
name: grep
description: >-
  Search decoded plain-text file contents with a regex and stable pagination.
  Defaults to the documents directory. Every result begins with shown, total,
  truncated, and next_offset metadata; continue while truncated=true before
  treating the search as exhaustive. This tool does not parse Office or PDF
  content: binary-file no-matches are not evidence of absence. Use glob for
  candidate discovery and read for format-aware review of those documents.
input_schema:
  type: object
  properties:
    pattern:
      type: string
      description: Regex pattern to search for.
    path:
      type: string
      description: File or directory to search. Defaults to the documents directory.
    glob:
      type: string
      description: Glob pattern to filter files, such as '**/*.txt'.
    output_mode:
      type: string
      enum: [content, files_with_matches, count]
      default: files_with_matches
      description: Return matching lines, matching file paths, or per-file counts.
    offset:
      type: integer
      minimum: 0
      default: 0
      description: Zero-based result offset. Use the prior page's next_offset.
    limit:
      type: integer
      minimum: 1
      maximum: 500
      default: 250
      description: Maximum records on this page.
    candidate_discovery:
      type: boolean
      default: false
      description: >-
        Set true only for a corpus-rooted search whose returned matter roots are
        legally plausible candidates that must each receive a ledger disposition.
        Keep false for a neutral census, a local matter search, or incidental hits.
  required:
  - pattern
  additionalProperties: false
disable_parallel: true
binding: tools.grep:grep
