[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evoharness"
version = "0.10.0"
description = "Evolve NexAU agent harnesses with pluggable evolution algorithms (AHE, RRSI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # NexAU v0.3.9, pinned by commit. Mirror of nex-agi/NexAU (Apache-2.0),
  # whose GitHub organization became unreachable on 2026-10-26.
  "nexau @ git+https://github.com/div652/NexAU-mirror.git@d12d5c3fdef986c1de1904e7a7cf40436039966a",
  # NexAU 0.3.9 imports ThinkingTextMessageContentEvent, removed in 1.0.
  "ag-ui-protocol>=0.1.10,<1.0",
  "greenlet>=3.1.1",
  "openai>=1.60",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
evoharness = "evoharness.cli:main"
# The command before the rename from ahe-runner (0.10.0).
ahe = "evoharness.cli:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["src/evoharness", "src/ahe_runner"]

[tool.hatch.build]
include = [
  "src/evoharness/**/*.py",
  "src/ahe_runner/**/*.py",
  "src/evoharness/**/*.md",
  "src/evoharness/**/*.yaml",
  "src/evoharness/meta/skills/**/*",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py311"
# Copied unchanged from the original AHE (MIT); keep it byte-identical.
extend-exclude = ["src/evoharness/meta/skills/nexau-evolution-guide"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
